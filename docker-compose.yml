# Local development infrastructure only. Production compose arrives in task 6.1.
#
# Setup:  cp .env.example .env   then edit .env
# Start:  docker compose up -d
# Stop:   docker compose down          (keeps the data)
#         docker compose down -v       (deletes the data)

name: gym

services:
  postgres:
    image: postgres:18
    container_name: gym-postgres
    restart: unless-stopped
    environment:
      # The ":?" form makes compose stop with this message instead of starting a
      # database with an empty password when .env is missing.
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env (copy .env.example)}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env (copy .env.example)}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (copy .env.example)}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # postgres:18 puts PGDATA in a versioned subdirectory, so the volume is mounted one
      # level above it. Mounting /var/lib/postgresql/data instead would leave the real
      # data directory outside the volume and lose it on every recreate.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      # "running" is not "ready": Postgres accepts TCP connections before it has finished
      # initialising. pg_isready is the readiness signal the API and the tests wait on.
      # $$ escapes to a literal $ so the variable is expanded inside the container.
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  seq:
    image: datalust/seq:2024.3
    container_name: gym-seq
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
    ports:
      - "${SEQ_UI_PORT:-8081}:80"
      - "${SEQ_INGESTION_PORT:-5341}:5341"
    volumes:
      - seq-data:/data
    healthcheck:
      # The Seq image ships neither curl nor wget and its bundled seqcli is broken, so the
      # readiness probe is a hand-written HTTP request over one of bash's /dev/tcp sockets.
      # A plain "is the port open" check would pass while Seq was still starting up.
      # /dev/tcp is a bash feature, so this uses the exec form: CMD-SHELL would run it
      # under dash, where the socket redirect is just a missing file.
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/localhost/80; printf "GET /health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3; head -1 <&3 | grep -q "200 OK"'
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres-data:
  seq-data:
