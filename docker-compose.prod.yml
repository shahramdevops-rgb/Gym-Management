# Production stack: API, Postgres and Caddy on one server (docs/adr/0003-deployment-topology.md).
#
# On the server this file sits next to /opt/gym/.env (copy deploy/env.example, fill it in).
# Locally, smoke-test it with:  docker compose -f docker-compose.prod.yml --env-file <file> up -d --build
#
# Images are tagged with ${TAG} so the previous release stays on the server and a bad one
# rolls back by starting the old tag. The API never migrates at startup: deploy/server.sh runs
# the "migrate" service (the EF migration bundle) before it starts a new API container
# (docs/ARCHITECTURE.md).

name: gym-prod

# What the API needs to start, shared with "migrate": the EF migration bundle boots the
# application's own host to find its DbContext, exactly as `dotnet ef` does, so it fails on the
# same missing settings the API would.
x-api-environment: &api-environment
  ASPNETCORE_ENVIRONMENT: Production
  # Only requests for our own domain are answered (Caddy passes the Host header through).
  AllowedHosts: ${DOMAIN:?set DOMAIN in .env}
  # Trust X-Forwarded-For only from Caddy's network. Same value as the pinned subnet at the
  # bottom of this file, from one variable so the two cannot drift.
  ForwardedHeaders__TrustedNetwork: ${GYM_SUBNET:-172.28.0.0/24}
  # Host, database and user are not secret. The password is a separate key on purpose:
  # AddInfrastructure() recombines them (BuildConnectionString).
  ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER}
  Postgres__Password: ${POSTGRES_PASSWORD}
  Jwt__SigningKey: ${JWT_SIGNING_KEY:?set JWT_SIGNING_KEY in .env (at least 32 random bytes)}
  Seed__OwnerUserName: ${SEED_OWNER_USERNAME:?set SEED_OWNER_USERNAME in .env}
  Seed__OwnerPassword: ${SEED_OWNER_PASSWORD:?set SEED_OWNER_PASSWORD in .env}

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    # No "ports:". The database is reachable only over this Compose network.
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    # Tuned for the server's RAM through .env, so a bigger server needs no edit to this file.
    command:
      - postgres
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS:-256MB}
      - -c
      - effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-768MB}
      - -c
      - max_connections=50
    volumes:
      # postgres:18 keeps PGDATA in a versioned subdirectory, so the volume is mounted one
      # level above it (see the same note in docker-compose.yml).
      - postgres-data:/var/lib/postgresql
    mem_limit: ${POSTGRES_MEM_LIMIT:-768m}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: &logging
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  api:
    build:
      context: .
      dockerfile: src/Gym.Api/Dockerfile
    image: gym-api:${TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment: *api-environment
    mem_limit: ${API_MEM_LIMIT:-512m}
    healthcheck:
      # The aspnet image ships neither curl nor wget, so this is a hand-written HTTP request
      # over bash's /dev/tcp. /health reports the database and pending migrations, so
      # "healthy" means the app can actually serve, not just that the process is up.
      # /dev/tcp is a bash feature: the exec form, because CMD-SHELL would run under dash.
      # The Host header is our domain because AllowedHosts refuses any other.
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/localhost/8080; printf "GET /health HTTP/1.1\r\nHost: ${DOMAIN}\r\nConnection: close\r\n\r\n" >&3; head -1 <&3 | grep -q "200 OK"'
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *logging

  # Not part of the running stack ("tools" profile): deploy/server.sh runs it once per release,
  # before the new API starts, as `docker compose run --rm migrate`. It runs the EF migration
  # bundle inside the API image, which already carries every native library the self-contained
  # bundle needs, and it reaches Postgres over the Compose network, where the database lives.
  migrate:
    image: gym-api:${TAG:-latest}
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/efbundle"]
    environment:
      <<: *api-environment
      # A single-file bundle unpacks native libraries on start; /tmp is writable, home may not be.
      DOTNET_BUNDLE_EXTRACT_BASE_DIR: /tmp
    volumes:
      - type: bind
        source: ./efbundle
        target: /efbundle
        read_only: true
        bind:
          # A missing bundle must be an error, not an empty directory Docker creates for us.
          create_host_path: false
    logging: *logging

  caddy:
    build:
      context: .
      dockerfile: web/Dockerfile
    image: gym-web:${TAG:-latest}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      # Optional second domain, permanently redirected to DOMAIN. Unset means no redirect.
      REDIRECT_DOMAIN: ${REDIRECT_DOMAIN:-no-redirect}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      # The issued certificates. Losing this volume means asking Let's Encrypt again on
      # every recreate, which runs into its rate limits.
      - caddy-data:/data
      - caddy-config:/config
    mem_limit: ${CADDY_MEM_LIMIT:-128m}
    logging: *logging

networks:
  default:
    ipam:
      config:
        # Pinned so the API can be told which addresses may send X-Forwarded-For
        # (ForwardedHeaders__TrustedNetwork above reads the same variable). Change it in .env
        # if the server already has a Docker network on this range.
        - subnet: ${GYM_SUBNET:-172.28.0.0/24}

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
