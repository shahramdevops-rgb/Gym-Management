<!doctype html>
<!-- lang and dir are set here, on the document itself, so the browser picks the reading
     direction before any JavaScript runs and there is no left-to-right flash on load. -->
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>مدیریت باشگاه</title>
    <!-- The saved theme goes on before anything is drawn, so a dark choice never flashes white
         on load. Same key as src/lib/theme.ts; blocked storage just leaves the page light. -->
    <script>
      try {
        if (localStorage.getItem("gym.theme") === "dark") {
          document.documentElement.classList.add("dark");
        }
      } catch {
        // Storage blocked: open light.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
